[package]
name = "wallet-conformance"
version = "0.1.0"
edition = "2021"
default-run = "wallet-conformance"
license = "Apache-2.0"
description = "Independent HTTP, live-chain and internal conformance tests for Cardano wallets"

[dependencies]
anyhow = "1.0"
bip39 = { version = "2.2", features = ["rand"] }
blake2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
hex = "0.4"
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
minicbor = { version = "0.26", features = ["std"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.23"

[features]
live-node-tests = []

[[test]]
name = "node_integration"
path = "tests/node_integration.rs"
required-features = ["live-node-tests"]
